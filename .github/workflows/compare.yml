name: Compare the dispatch rule with the VATE vectors

on:
  push:
    branches: [vate-1, vate-1-wip]

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # PINS is the only place where the two commits and the sha256 of the
      # VATE manifest are written.
      - name: Read PINS
        id: pins
        run: |
          grep -E '^[A-Z_]+=' PINS | awk -F= '{ print tolower($1) "=" $2 }' >> "$GITHUB_OUTPUT"
          grep -E '^[A-Z_]+=' PINS

      - name: Fetch TRIEL grammar at the pinned commit into grammar/
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.pins.outputs.grammar_repository }}
          ref: ${{ steps.pins.outputs.grammar_commit }}
          path: grammar
          persist-credentials: false

      - name: Fetch the VATE repository at the pinned commit into vate/
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.pins.outputs.vate_repository }}
          ref: ${{ steps.pins.outputs.vate_commit }}
          path: vate
          persist-credentials: false

      - name: Check the pinned commits and the sha256 of the VATE manifest
        run: |
          test "$(git -C grammar rev-parse HEAD)" = "${{ steps.pins.outputs.grammar_commit }}"
          test "$(git -C vate rev-parse HEAD)" = "${{ steps.pins.outputs.vate_commit }}"
          echo "${{ steps.pins.outputs.vate_manifest_sha256 }}  vate/${{ steps.pins.outputs.vate_vectors }}/MANIFEST.json" | sha256sum -c -
          git -C grammar rev-parse HEAD
          git -C vate rev-parse HEAD

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install lark for the translator
        run: pip install lark==1.3.1

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.6.7"

      # grammar/evaluator/README.md: generated/TRIEL.hs is committed in
      # grammar, so Isabelle is not needed here.
      - name: Build the evaluator
        working-directory: grammar
        run: |
          ghc --version
          ghc -O1 -ievaluator/generated -outputdir evaluator/build -o evaluator/triel-eval evaluator/Main.hs
          sha256sum evaluator/generated/TRIEL.hs evaluator/Main.hs

      # The tests read the same VATE files as the mapping script.
      - name: Tests of the mapping script
        run: python3 -I -m unittest discover -s mapping -p 'test_*.py' -v

      - name: Generate the scenarios again and compare them with the committed ones
        run: python3 -I mapping/map_vate.py --check

      - name: The translator accepts both specifications
        run: python3 -I grammar/parser/triel_to_core.py --classify specs

      # Every report must be the committed .expected file, character for
      # character, and the exit code the committed .exitcode. Exit code 3 (a
      # monitor blocks the probe) is an expected result, not a failure of the
      # step.
      - name: triel check on every scenario, against the expected reports
        run: |
          status=0
          for scn in scenarios/dispatch/*.scn scenarios/absence/*.scn; do
            case "$scn" in
              scenarios/dispatch/*) spec=specs/dispatch_rule.triel ;;
              *) spec=specs/absence_check.triel ;;
            esac
            stem="${scn%.scn}"
            set +e
            python3 -I grammar/parser/triel.py check "$spec" "$scn" --last > "$RUNNER_TEMP/out.txt" 2> "$RUNNER_TEMP/err.txt"
            code=$?
            set -e
            want="$(cat "$stem.exitcode")"
            if diff -u "$stem.expected" "$RUNNER_TEMP/out.txt" > "$RUNNER_TEMP/diff.txt" && [ "$code" = "$want" ]; then
              echo "same    $scn  exit $code"
            else
              status=1
              echo "::error file=$scn::the report or the exit code differs from the expected one (exit $code, expected $want)"
              echo "----- full output of triel check, exit $code"
              cat "$RUNNER_TEMP/out.txt"
              echo "----- standard error"
              cat "$RUNNER_TEMP/err.txt"
              echo "----- diff, expected then output"
              cat "$RUNNER_TEMP/diff.txt"
              echo "-----"
            fi
          done
          exit $status

      - name: Build the comparison table and compare it with COMPARISON.md
        run: python3 -I compare/compare.py --check
